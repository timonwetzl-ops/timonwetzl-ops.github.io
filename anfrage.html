<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchen — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">

<style>
  .selectedPkg{
    display:flex;
    gap:18px;
    align-items:center;
    background:var(--bg-card);
    border-radius:18px;
    padding:18px;
    margin-bottom:30px;
    border:1px solid #3a2b1f16;
  }

  .selectedPkg img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:12px;
    flex-shrink:0;
  }

  .selectedPkg .price{
    font-family:'JetBrains Mono',monospace;
    color:var(--yellow);
    font-weight:600;
  }

  /* Kalender */
  :root{
    --rangecolor:#5f9ea0;
  }

  .cal-hint{
    color:var(--cream-dim);
    font-size:.85rem;
    margin:-4px 0 12px;
  }

  .cal-legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:.8rem;
    color:var(--cream-dim);
    margin:10px 0 4px;
  }

  .cal-legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }

  .cal-legend i{
    width:14px;
    height:14px;
    border-radius:4px;
    display:inline-block;
    flex-shrink:0;
  }

  .cal-legend i.leg-full{
    background:var(--rangecolor);
  }

  .cal-legend i.leg-half{
    background:
      linear-gradient(
        135deg,
        var(--bg-card) 50%,
        var(--rangecolor) 50%
      );
    border:1px solid var(--line);
  }

  .cal-legend i.leg-taken{
    background:var(--bg-card);
    opacity:.4;
    border:1px solid var(--line);
  }

  .cal-grid button{
    position:relative;
    transition:.15s ease;
  }

  .cal-grid button.full{
    background:var(--rangecolor);
    color:#fff;
  }

  .cal-grid button.half-before{
    background:
      linear-gradient(
        135deg,
        var(--bg-card) 50%,
        var(--rangecolor) 50%
      );
    color:var(--cream);
  }

  .cal-grid button.half-after{
    background:
      linear-gradient(
        135deg,
        var(--rangecolor) 50%,
        var(--bg-card) 50%
      );
    color:var(--cream);
  }

  .cal-grid button.internal-blocked{
    opacity:.35;
    cursor:not-allowed;
  }

  .cal-grid button.booking-blocked{
    opacity:.4;
    cursor:not-allowed;
  }

  .cal-grid button.selected{
    box-shadow:0 0 0 2px var(--yellow);
  }

  .priceBox{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    background:var(--bg-card);
    border-radius:12px;
    padding:14px 18px;
    margin:18px 0;
  }

  .priceBox .amount{
    font-family:'JetBrains Mono',monospace;
    font-size:1.3rem;
    color:var(--yellow);
    font-weight:700;
  }

  .selected-days-info{
    margin-top:12px;
    color:var(--cream-dim);
    font-size:.85rem;
  }
</style>
</head>

<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
<section>

  <div class="eyebrow">Buchen</div>
  <h2 class="section-title">Termin & Buchung</h2>

  <div id="selectedPkgBox"></div>

  <form class="panel" id="bookingForm">

    <label>Name</label>
    <input type="text" id="f_name" required>

    <label>E-Mail</label>
    <input type="email" id="f_email" required>

    <label>Telefonnummer</label>
    <input type="tel" id="f_phone">

    <label>Veranstaltungsort</label>
    <input
      type="text"
      id="f_location"
      placeholder="Ort / Adresse"
    >

    <label>Veranstaltungstage</label>

    <div class="cal-hint">
      Tippe die Tage an, an denen deine Veranstaltung stattfindet.
      Abholung und Rückgabe werden automatisch als halbe Tage dargestellt
      und nicht berechnet.
    </div>

    <div class="cal" id="calendar"></div>

    <div class="cal-legend">
      <span>
        <i class="leg-full"></i>
        Veranstaltungstag
      </span>

      <span>
        <i class="leg-half"></i>
        Abhol-/Rückgabetag
      </span>

      <span>
        <i class="leg-taken"></i>
        Nicht verfügbar
      </span>
    </div>

    <div
      class="cal-selected"
      id="calSelected"
    >
      Noch kein Veranstaltungstag ausgewählt.
    </div>

    <div
      class="selected-days-info"
      id="selectedDaysInfo"
    ></div>

    <label>Gewünschtes Paket</label>
    <select id="f_package"></select>

    <label>Nachricht / zusätzliche Wünsche</label>
    <textarea
      id="f_message"
      placeholder="Anzahl Gäste, besondere Wünsche…"
    ></textarea>

    <div class="priceBox">
      <span>Voraussichtlicher Preis</span>
      <span
        class="amount"
        id="totalPriceDisplay"
      >
        0,00 €
      </span>
    </div>

    <button
      class="btn block"
      type="submit"
    >
      Buchung senden
    </button>

    <div id="formStatus"></div>

  </form>

</section>
</main>

<footer
  class="site-footer"
  id="site-footer"
></footer>


<script type="module">

import {
  renderNav,
  renderFooter
} from "./nav.js";

import {
  db,
  auth,
  placeholderImg
} from "./firebase-init.js";

import {
  collection,
  getDocs,
  doc,
  getDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================================================
   GRUNDEINSTELLUNGEN
   ========================================================= */

renderNav("anfrage.html");
renderFooter();

const PACKAGE_IDS = [
  "basic",
  "comfort",
  "rundumsorglos"
];

const params = new URLSearchParams(location.search);
const preselected = params.get("package");

/*
  Nach einem Veranstaltungstag wird die Candybar
  für die folgenden 7 Tage intern blockiert.

  Diese Sperrtage werden dem Kunden NICHT als
  Veranstaltungstage angezeigt.
*/
const INTERNAL_BLOCK_DAYS = 7;


/* =========================================================
   DATEN
   ========================================================= */

let currentUser = null;

let blockedDates = new Set();

/*
  Diese Tage kommen aus bestehenden Buchungen.
*/
let bookingBlockedDates = new Set();

/*
  Diese Tage sind aufgrund der 7-Tage-Sperre
  intern nicht verfügbar.
*/
let internalBlockedDates = new Set();

/*
  Die tatsächlich vom Kunden ausgewählten
  Veranstaltungstage.
*/
let selectedEventDates = new Set();

let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();

let allPackagesData = [];


/* =========================================================
   LOGIN
   ========================================================= */

onAuthStateChanged(auth, async (user) => {

  currentUser = user;

  if (!user) {

    const q = new URLSearchParams();

    q.set(
      "next",
      "anfrage.html"
    );

    if (preselected) {
      q.set(
        "package",
        preselected
      );
    }

    location.href =
      "anmelden.html?" +
      q.toString();

    return;
  }

  document.getElementById("f_email").value =
    user.email || "";

  await init();
});


/* =========================================================
   INITIALISIERUNG
   ========================================================= */

async function init() {

  await loadPackagesIntoSelect();

  await showSelectedPkgBox();

  await loadBlockedDates();

  renderCalendar();

  updateCalSelectedText();

  updatePriceDisplay();
}


/* =========================================================
   PAKETE
   ========================================================= */

function formatPrice(price) {

  return price
    ? price + " / Tag"
    : "";
}


async function loadPackagesIntoSelect() {

  const select =
    document.getElementById("f_package");

  select.innerHTML = "";

  allPackagesData = [];

  for (const id of PACKAGE_IDS) {

    const snap = await getDoc(
      doc(db, "packages", id)
    );

    if (!snap.exists()) {
      continue;
    }

    const p = {
      id,
      ...snap.data()
    };

    p.priceNumeric =
      parseFloat(
        (p.price || "")
          .toString()
          .replace(/[^\d.,]/g, "")
          .replace(",", ".")
      ) || 0;

    allPackagesData.push(p);

    const option =
      document.createElement("option");

    option.value = p.name;

    option.textContent = p.name;

    if (
      preselected &&
      preselected === p.name
    ) {
      option.selected = true;
    }

    select.appendChild(option);
  }
}


function pkgBoxHtml(p) {

  const img =
    (p.images && p.images[0]) ||
    placeholderImg(
      p.name,
      "#f28fa3"
    );

  return `
    <div class="eyebrow">
      Dein ausgewähltes Paket
    </div>

    <div class="selectedPkg">

      <img
        src="${img}"
        alt=""
      >

      <div>

        <h3 style="margin-bottom:4px">
          ${p.name}
        </h3>

        <div class="price">
          ${formatPrice(p.price)}
        </div>

        <p
          style="
            color:var(--cream-dim);
            font-size:.9rem;
            margin:4px 0 0
          "
        >
          ${p.description || ""}
        </p>

      </div>

    </div>
  `;
}


async function showSelectedPkgBox() {

  const box =
    document.getElementById(
      "selectedPkgBox"
    );

  const name =
    preselected ||
    (
      allPackagesData[0] &&
      allPackagesData[0].name
    );

  const p =
    allPackagesData.find(
      item => item.name === name
    );

  if (!p) {

    box.innerHTML = "";

    return;
  }

  box.innerHTML =
    pkgBoxHtml(p);
}


document
  .getElementById("f_package")
  .addEventListener(
    "change",
    (e) => {

      const p =
        allPackagesData.find(
          item =>
            item.name ===
            e.target.value
        );

      if (!p) {
        return;
      }

      document
        .getElementById(
          "selectedPkgBox"
        )
        .innerHTML =
        pkgBoxHtml(p);

      updatePriceDisplay();
    }
  );


/* =========================================================
   DATUMS-HILFSFUNKTIONEN
   ========================================================= */

function isoFromDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function dateFromIso(iso) {

  return new Date(
    iso + "T00:00:00"
  );
}


function addDays(iso, amount) {

  const date =
    dateFromIso(iso);

  date.setDate(
    date.getDate() + amount
  );

  return isoFromDate(date);
}


function formatDe(iso) {

  const [y, m, d] =
    iso.split("-");

  return `${d}.${m}.${y}`;
}


/* =========================================================
   BESTEHENDE BUCHUNGEN LADEN
   ========================================================= */

async function loadBlockedDates() {

  const snap =
    await getDocs(
      collection(
        db,
        "bookings"
      )
    );

  bookingBlockedDates =
    new Set();

  internalBlockedDates =
    new Set();

  snap.forEach((document) => {

    const booking =
      document.data();

    /*
      Nur abgelehnte Buchungen
      werden ignoriert.
    */
    if (
      booking.bookingStatus ===
        "abgelehnt" ||
      booking.status ===
        "abgelehnt"
    ) {
      return;
    }

    const ranges =
      (
        booking.ranges &&
        booking.ranges.length
      )
        ? booking.ranges
        : (
            booking.eventDate
              ? [{
                  start:
                    booking.eventDate,
                  end:
                    booking.eventDate
                }]
              : []
          );

    ranges.forEach(range => {

      if (
        !range.start ||
        !range.end
      ) {
        return;
      }

      /*
        Alle Veranstaltungstage
        der bestehenden Buchung.
      */
      let current =
        dateFromIso(
          range.start
        );

      const end =
        dateFromIso(
          range.end
        );

      while (
        current <= end
      ) {

        const iso =
          isoFromDate(current);

        bookingBlockedDates.add(
          iso
        );

        /*
          Die 7 Tage NACH dem
          Veranstaltungstag werden
          intern ebenfalls blockiert.
        */
        for (
          let i = 1;
          i <= INTERNAL_BLOCK_DAYS;
          i++
        ) {

          internalBlockedDates.add(
            addDays(
              iso,
              i
            )
          );
        }

        current.setDate(
          current.getDate() + 1
        );
      }

    });

  });


  /*
    Auch einen Tag vor und nach
    einer bestehenden Buchung
    als Abholung/Rückgabe blockieren.
  */
  bookingBlockedDates.forEach(
    iso => {

      bookingBlockedDates.add(
        addDays(iso, -1)
      );

      bookingBlockedDates.add(
        addDays(iso, 1)
      );

    }
  );


  rebuildBlockedDates();
}


function rebuildBlockedDates() {

  blockedDates =
    new Set([
      ...bookingBlockedDates,
      ...internalBlockedDates
    ]);
}


/* =========================================================
   KALENDER
   ========================================================= */

function isUnavailable(iso) {

  return blockedDates.has(iso);
}


function isBookingBlocked(iso) {

  return bookingBlockedDates.has(iso);
}


function isInternalBlocked(iso) {

  return (
    internalBlockedDates.has(iso) &&
    !bookingBlockedDates.has(iso)
  );
}


function renderCalendar() {

  const cal =
    document.getElementById(
      "calendar"
    );

  const first =
    new Date(
      calYear,
      calMonth,
      1
    );

  const startWeekday =
    (
      first.getDay() + 6
    ) % 7;

  const daysInMonth =
    new Date(
      calYear,
      calMonth + 1,
      0
    ).getDate();

  const monthNames = [
    "Januar",
    "Februar",
    "März",
    "April",
    "Mai",
    "Juni",
    "Juli",
    "August",
    "September",
    "Oktober",
    "November",
    "Dezember"
  ];

  let html = `
    <div class="cal-head">

      <button
        type="button"
        onclick="calNav(-1)"
      >
        ‹
      </button>

      <div class="label">
        ${monthNames[calMonth]}
        ${calYear}
      </div>

      <button
        type="button"
        onclick="calNav(1)"
      >
        ›
      </button>

    </div>

    <div class="cal-grid">

      ${
        [
          "Mo",
          "Di",
          "Mi",
          "Do",
          "Fr",
          "Sa",
          "So"
        ]
          .map(
            day =>
              `<div class="dow">${day}</div>`
          )
          .join("")
      }
  `;


  for (
    let i = 0;
    i < startWeekday;
    i++
  ) {

    html += `<div></div>`;
  }


  const today =
    new Date();

  today.setHours(
    0,
    0,
    0,
    0
  );


  for (
    let day = 1;
    day <= daysInMonth;
    day++
  ) {

    const dateObj =
      new Date(
        calYear,
        calMonth,
        day
      );

    const iso =
      isoFromDate(
        dateObj
      );

    const isPast =
      dateObj < today;

    const selected =
      selectedEventDates.has(
        iso
      );

    /*
      Prüfen, ob dieser Tag
      direkt vor einem ausgewählten
      Veranstaltungstag liegt.
    */
    const isHalfBefore =
      selectedEventDates.has(
        addDays(iso, 1)
      );

    /*
      Prüfen, ob dieser Tag
      direkt nach einem ausgewählten
      Veranstaltungstag liegt.
    */
    const isHalfAfter =
      selectedEventDates.has(
        addDays(iso, -1)
      );


    let classes = [];

    /*
      Ausgewählter Veranstaltungstag
    */
    if (selected) {

      classes.push("full");
      classes.push("selected");

    }

    /*
      Abholtag
    */
    else if (isHalfBefore) {

      classes.push(
        "half-before"
      );

    }

    /*
      Rückgabetag
    */
    else if (isHalfAfter) {

      classes.push(
        "half-after"
      );

    }


    /*
      Interne Sperre
    */
    if (
      isInternalBlocked(iso)
    ) {

      classes.push(
        "internal-blocked"
      );

    }


    /*
      Bereits durch eine andere
      Buchung blockiert
    */
    if (
      isBookingBlocked(iso)
    ) {

      classes.push(
        "booking-blocked"
      );

    }


    /*
      Vergangene Tage können
      ebenfalls nicht gewählt werden.
    */
    const disabled =
      isPast ||
      isUnavailable(iso);


    html += `
      <button
        type="button"
        ${disabled ? "disabled" : ""}
        class="${classes.join(" ")}"
        onclick="pickDate('${iso}')"
        title="${
          selected
            ? "Veranstaltungstag – wird berechnet"
            : isInternalBlocked(iso)
              ? "Intern nicht verfügbar"
              : isBookingBlocked(iso)
                ? "Nicht verfügbar"
                : ""
        }"
      >
        ${day}
      </button>
    `;
  }


  html += `
    </div>
  `;

  cal.innerHTML =
    html;
}


/* =========================================================
   MONAT WECHSELN
   ========================================================= */

window.calNav =
  function(dir) {

    calMonth += dir;

    if (
      calMonth < 0
    ) {

      calMonth = 11;
      calYear--;

    }

    if (
      calMonth > 11
    ) {

      calMonth = 0;
      calYear++;

    }

    renderCalendar();
  };


/* =========================================================
   VERANSTALTUNGSTAG AUSWÄHLEN
   ========================================================= */

window.pickDate =
  function(iso) {

    /*
      Sicherheitsprüfung:
      Nicht verfügbare Tage können
      nicht ausgewählt werden.
    */
    if (
      isUnavailable(iso)
    ) {
      return;
    }


    /*
      Bereits ausgewählt?
      Dann wieder entfernen.
    */
    if (
      selectedEventDates.has(
        iso
      )
    ) {

      selectedEventDates.delete(
        iso
      );

    }

    /*
      Sonst hinzufügen.
    */
    else {

      selectedEventDates.add(
        iso
      );

    }


    /*
      Alles neu berechnen,
      damit die halben Tage
      immer korrekt sind.
    */
    renderCalendar();

    updateCalSelectedText();

    updatePriceDisplay();
  };


/* =========================================================
   AUSGEWÄHLTE TAGE ANZEIGEN
   ========================================================= */

function getSortedSelectedDates() {

  return [
    ...selectedEventDates
  ].sort();

}


function updateCalSelectedText() {

  const el =
    document.getElementById(
      "calSelected"
    );

  const info =
    document.getElementById(
      "selectedDaysInfo"
    );

  const dates =
    getSortedSelectedDates();


  if (
    dates.length === 0
  ) {

    el.textContent =
      "Noch kein Veranstaltungstag ausgewählt.";

    el.style.color =
      "var(--cream-dim)";

    info.textContent =
      "";

    return;
  }


  el.textContent =
    `${dates.length} Veranstaltungstag${
      dates.length === 1
        ? ""
        : "e"
    } ausgewählt.`;

  el.style.color =
    "var(--mint)";


  info.textContent =
    dates
      .map(
        date =>
          formatDe(date)
      )
      .join(", ");
}


/* =========================================================
   PREIS
   ========================================================= */

function totalRentalDays() {

  /*
    Nur tatsächlich ausgewählte
    Veranstaltungstage zählen.

    Halbe Tage zählen NICHT.
  */
  return selectedEventDates.size;
}


function updatePriceDisplay() {

  const pkgName =
    document.getElementById(
      "f_package"
    ).value;

  const p =
    allPackagesData.find(
      item =>
        item.name === pkgName
    );

  const daily =
    p
      ? p.priceNumeric
      : 0;

  const days =
    totalRentalDays();

  const total =
    daily * days;


  document
    .getElementById(
      "totalPriceDisplay"
    )
    .textContent =
    total
      .toFixed(2)
      .replace(".", ",") +
    " €";
}


/* =========================================================
   BUCHUNG ABSENDEN
   ========================================================= */

document
  .getElementById(
    "bookingForm"
  )
  .addEventListener(
    "submit",
    async (e) => {

      e.preventDefault();


      if (
        selectedEventDates.size === 0
      ) {

        const el =
          document.getElementById(
            "calSelected"
          );

        el.textContent =
          "Bitte wähl zuerst mindestens einen Veranstaltungstag aus.";

        el.style.color =
          "var(--pink)";

        return;
      }


      const status =
        document.getElementById(
          "formStatus"
        );

      status.textContent =
        "Wird gesendet…";

      status.style.color =
        "var(--cream-dim)";


      const pkgName =
        document.getElementById(
          "f_package"
        ).value;

      const p =
        allPackagesData.find(
          item =>
            item.name === pkgName
        );

      const daily =
        p
          ? p.priceNumeric
          : 0;

      const rentalDays =
        totalRentalDays();

      const total =
        daily * rentalDays;


      const selectedDates =
        getSortedSelectedDates();


      /*
        Für die Datenbank speichern wir
        jeden ausgewählten Veranstaltungstag
        als eigenen Zeitraum.

        Beispiel:
        25. + 26.

        wird zu:

        [
          { start:"2026-09-25", end:"2026-09-25" },
          { start:"2026-09-26", end:"2026-09-26" }
        ]
      */
      const ranges =
        selectedDates.map(
          date => ({
            start: date,
            end: date
          })
        );


      const eventDateSummary =
        selectedDates
          .map(
            date =>
              formatDe(date)
          )
          .join(", ");


      try {

        await addDoc(
          collection(
            db,
            "bookings"
          ),
          {

            uid:
              currentUser.uid,

            name:
              document.getElementById(
                "f_name"
              ).value,

            email:
              document.getElementById(
                "f_email"
              ).value,

            phone:
              document.getElementById(
                "f_phone"
              ).value,

            location:
              document.getElementById(
                "f_location"
              ).value,

            /*
              Übersichtliche Anzeige
              der Veranstaltungstage.
            */
            eventDate:
              eventDateSummary,

            /*
              Nur echte Veranstaltungstage.
            */
            ranges:
              ranges,

            package:
              pkgName,

            /*
              Preis basiert ausschließlich
              auf den ausgewählten Tagen.
            */
            price:
              total,

            rentalDays:
              rentalDays,

            message:
              document.getElementById(
                "f_message"
              ).value,

            bookingStatus:
              "neu",

            paymentStatus:
              "offen",

            paidAmount:
              0,

            createdAt:
              serverTimestamp()
          }
        );


        status.textContent =
          "Danke! Deine Buchung ist da — schau bald bei „Meine Buchungen“ vorbei.";

        status.style.color =
          "var(--mint)";


        setTimeout(
          () => {
            location.href =
              "meine-buchungen.html";
          },
          1400
        );


      } catch (err) {

        status.textContent =
          "Ups, das hat nicht geklappt. Versuch's nochmal.";

        status.style.color =
          "var(--pink)";

        console.error(err);
      }

    }
  );

</script>

</body>
</html>
