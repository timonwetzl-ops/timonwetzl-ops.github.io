<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchen — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">
<style>
  .selectedPkg{display:flex;gap:18px;align-items:center;background:var(--bg-card);border-radius:18px;padding:18px;margin-bottom:30px;border:1px solid var(--line);max-width:680px;}
  .selectedPkg img{width:100px;height:100px;object-fit:cover;border-radius:14px;flex-shrink:0;}
  .selectedPkg .price{font-family:'JetBrains Mono',monospace;color:var(--cream-dim);font-weight:600;}
</style>
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <h2 class="section-title">Buchen</h2>

    <div id="selectedPkgBox"></div>

    <form class="panel" id="bookingForm">
      <label>Name</label>
      <input type="text" id="f_name" required>

      <label>E-Mail</label>
      <input type="email" id="f_email" required>

      <label>Telefonnummer</label>
      <input type="tel" id="f_phone">

      <label>Veranstaltungsort</label>
      <input type="text" id="f_location" placeholder="Ort / Adresse">

      <label>Gewünschtes Paket</label>
      <select id="f_package"></select>

      <label>Zeitraum (Abholtag und Rückgabetag auswählen)</label>
      <div class="cal" id="calendar"></div>
      <div class="cal-legend">
        <span class="l-full">belegt</span>
        <span class="l-half">halber Tag belegt</span>
        <span class="l-sel">deine Auswahl</span>
      </div>
      <div class="cal-selected" id="calSelected">Bitte wähle zuerst den Abholtag.</div>

      <label>Nachricht / zusätzliche Wünsche</label>
      <textarea id="f_message" placeholder="Anzahl Gäste, besondere Wünsche…"></textarea>

      <div class="price-box" id="priceBox" style="display:none"></div>

      <button class="btn block" type="submit">Buchung senden</button>
      <div id="formStatus"></div>
    </form>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { db, auth, placeholderImg } from "./firebase-init.js";
  import {
    collection, getDocs, doc, getDoc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  renderNav("anfrage.html");
  renderFooter();

  const PACKAGE_IDS = ["basic","comfort","rundumsorglos"];
  const LEAD_DAYS = 14; // die nächsten 2 Wochen sind immer belegt
  const params = new URLSearchParams(location.search);
  const preselected = params.get("package");

  let currentUser = null;
  let allPackagesData = [];
  let startDate = null;   // Abholtag (Nachmittag)
  let endDate = null;     // Rückgabetag (bis Mittag)
  let calMonth = new Date().getMonth();
  let calYear = new Date().getFullYear();

  // belegte Tage: voll / Nachmittag belegt (Start eines anderen) / Vormittag belegt (Ende eines anderen)
  let fullSet = new Set(), pmTaken = new Set(), amTaken = new Set();

  // ---------- Datums-Helfer (lokal, ohne Zeitzonen-Fehler) ----------
  const pad = n => String(n).padStart(2,"0");
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parse = iso => { const [y,m,d] = iso.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (iso,n) => { const d = parse(iso); d.setDate(d.getDate()+n); return fmt(d); };
  const diffDays = (a,b) => Math.round((parse(b)-parse(a))/86400000);
  const nice = iso => { const [y,m,d] = iso.split("-"); return `${d}.${m}.${y}`; };
  const todayIso = fmt(new Date());
  const firstBookable = addDays(todayIso, LEAD_DAYS);

  onAuthStateChanged(auth, (user)=>{
    currentUser = user;
    if(!user){
      const q = new URLSearchParams();
      q.set("next", "anfrage.html");
      if(preselected) q.set("package", preselected);
      location.href = "anmelden.html?" + q.toString();
      return;
    }
    document.getElementById("f_email").value = user.email;
    init();
  });

  async function init(){
    await loadPackages();
    showSelectedPkgBox();
    await loadBlocked();
    renderCalendar();
  }

  // ---------- Pakete ----------
  function perDay(p){
    return parseFloat((p.price||"").toString().replace(/[^\d.,]/g,"").replace(",",".")) || 0;
  }
  async function loadPackages(){
    const select = document.getElementById("f_package");
    select.innerHTML = "";
    for(const id of PACKAGE_IDS){
      const snap = await getDoc(doc(db,"packages",id));
      if(!snap.exists()) continue;
      const p = {id, ...snap.data()};
      allPackagesData.push(p);
      const opt = document.createElement("option");
      opt.value = p.name;
      opt.textContent = p.name;
      if(preselected && preselected === p.name) opt.selected = true;
      select.appendChild(opt);
    }
  }
  function currentPackage(){
    return allPackagesData.find(p => p.name === document.getElementById("f_package").value);
  }
  function showSelectedPkgBox(){
    const box = document.getElementById("selectedPkgBox");
    const p = currentPackage();
    if(!p){ box.innerHTML = ""; return; }
    const img = (p.images && p.images[0]) || placeholderImg(p.name,"#e8789e");
    box.innerHTML = `
      <div class="eyebrow" style="margin-bottom:10px">Dein ausgewähltes Paket</div>
      <div class="selectedPkg">
        <img src="${img}">
        <div>
          <h3 style="margin-bottom:4px">${p.name}</h3>
          <div class="price">${p.price||""} <small>pro Tag</small></div>
          <p style="color:var(--cream-dim);font-size:.9rem;margin:4px 0 0">${p.description||""}</p>
        </div>
      </div>`;
  }
  document.getElementById("f_package").addEventListener("change", ()=>{
    showSelectedPkgBox();
    updatePrice();
  });

  // ---------- Belegung laden ----------
  function addBlocked(S, E){
    if(!S) return;
    if(!E || E === S){ fullSet.add(S); return; }
    pmTaken.add(S);          // am Starttag ist der Nachmittag belegt
    amTaken.add(E);          // am Endtag ist der Vormittag belegt
    for(let d = addDays(S,1); d < E; d = addDays(d,1)) fullSet.add(d);
  }
  async function loadBlocked(){
    fullSet = new Set(); pmTaken = new Set(); amTaken = new Set();
    // 1) öffentliche Sperrliste (ohne persönliche Daten)
    try{
      const snap = await getDocs(collection(db,"blocked"));
      snap.forEach(d => { const b = d.data(); addBlocked(b.startDate, b.endDate); });
    }catch(e){ console.warn("blocked nicht lesbar", e); }
    // 2) ältere Buchungen (nur für Admin lesbar, sonst ignorieren)
    try{
      const snap = await getDocs(collection(db,"bookings"));
      snap.forEach(d => {
        const b = d.data();
        if(b.bookingStatus === "abgelehnt" || b.status === "abgelehnt") return;
        if(b.startDate){ addBlocked(b.startDate, b.endDate); }
        else if(b.eventDate){ addBlocked(addDays(b.eventDate,-1), addDays(b.eventDate,1)); }
      });
    }catch(e){ /* normale Kunden dürfen nicht alle Buchungen lesen – ist okay */ }
  }

  // ---------- Regeln ----------
  const isFull = d => fullSet.has(d) || (pmTaken.has(d) && amTaken.has(d));
  const tooEarly = d => d < firstBookable;
  const canStart = d => !tooEarly(d) && !isFull(d) && !pmTaken.has(d);
  const canEnd   = d => !tooEarly(d) && !isFull(d) && !amTaken.has(d);
  function interiorFree(a,b){
    for(let d = addDays(a,1); d < b; d = addDays(d,1)){
      if(isFull(d) || pmTaken.has(d) || amTaken.has(d)) return false;
    }
    return true;
  }
  const validRange = (a,b) => b > a && canStart(a) && canEnd(b) && interiorFree(a,b);

  // ---------- Kalender ----------
  function renderCalendar(){
    const cal = document.getElementById("calendar");
    const first = new Date(calYear, calMonth, 1);
    const startWeekday = (first.getDay()+6)%7;
    const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    const monthNames = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
    let html = `<div class="cal-head">
      <button type="button" onclick="calNav(-1)">‹</button>
      <div class="label">${monthNames[calMonth]} ${calYear}</div>
      <button type="button" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid">
      ${["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<div class="dow">${d}</div>`).join("")}`;
    for(let i=0;i<startWeekday;i++) html += `<div></div>`;

    for(let day=1; day<=daysInMonth; day++){
      const iso = `${calYear}-${pad(calMonth+1)}-${pad(day)}`;
      let cls = "", disabled = false;

      // Belegung darstellen
      if(isFull(iso)) cls = "full";
      else if(pmTaken.has(iso)) cls = "half-pm";
      else if(amTaken.has(iso)) cls = "half-am";

      // Auswahl darstellen
      if(startDate && iso === startDate) cls = endDate ? "sel-start" : "sel-start";
      else if(endDate && iso === endDate) cls = "sel-end";
      else if(startDate && endDate && iso > startDate && iso < endDate) cls = "sel";

      // anklickbar?
      if(tooEarly(iso) || isFull(iso)) disabled = true;
      else if(!startDate || (startDate && endDate)){
        disabled = !canStart(iso);
      } else {
        // Start gewählt, Ende fehlt
        if(iso === startDate) disabled = false;
        else if(iso < startDate) disabled = !canStart(iso);
        else disabled = !validRange(startDate, iso);
      }
      html += `<button type="button" ${disabled?"disabled":""} class="${cls}" onclick="pickDate('${iso}')">${day}</button>`;
    }
    html += `</div>`;
    cal.innerHTML = html;
    updateHint();
    updatePrice();
  }
  window.calNav = function(dir){
    calMonth += dir;
    if(calMonth<0){calMonth=11;calYear--;}
    if(calMonth>11){calMonth=0;calYear++;}
    renderCalendar();
  }
  window.pickDate = function(iso){
    if(!startDate || (startDate && endDate)){
      // neue Auswahl beginnen
      startDate = iso; endDate = null;
    } else if(iso === startDate){
      startDate = null; endDate = null;   // nochmal auf den Starttag = zurücksetzen
    } else if(iso < startDate){
      startDate = iso;                    // früherer Tag = neuer Start
    } else if(validRange(startDate, iso)){
      endDate = iso;
    }
    renderCalendar();
  }

  function updateHint(){
    const el = document.getElementById("calSelected");
    el.style.color = "var(--lavender)";
    if(!startDate) el.textContent = "Bitte wähle zuerst den Abholtag.";
    else if(!endDate) el.textContent = `Abholtag: ${nice(startDate)} – jetzt den Rückgabetag wählen.`;
    else el.textContent = `Zeitraum: ${nice(startDate)} bis ${nice(endDate)}`;
  }

  // ---------- Preis ----------
  function computePrice(){
    const p = currentPackage();
    if(!p || !startDate || !endDate) return null;
    const days = diffDays(startDate, endDate);   // Abholtag + Rückgabetag zählen zusammen als 1 Tag
    const pd = perDay(p);
    return { days, perDay: pd, total: days * pd };
  }
  function updatePrice(){
    const box = document.getElementById("priceBox");
    const r = computePrice();
    if(!r){ box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = `${r.days} ${r.days===1?"Tag":"Tage"} × ${r.perDay.toFixed(2).replace(".",",")} € = <strong>${r.total.toFixed(2).replace(".",",")} €</strong>`;
  }

  // ---------- Absenden ----------
  document.getElementById("bookingForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const status = document.getElementById("formStatus");
    if(!startDate || !endDate){
      const el = document.getElementById("calSelected");
      el.textContent = "Bitte wähle Abholtag und Rückgabetag aus.";
      el.style.color = "var(--pink)";
      return;
    }
    const r = computePrice();
    status.textContent = "Wird gesendet…";
    status.style.color = "var(--cream-dim)";
    try{
      const bref = doc(collection(db,"bookings"));
      await setDoc(bref,{
        uid: currentUser.uid,
        name: document.getElementById("f_name").value,
        email: document.getElementById("f_email").value,
        phone: document.getElementById("f_phone").value,
        location: document.getElementById("f_location").value,
        startDate, endDate,
        eventDate: startDate,                 // für ältere Ansichten
        days: r.days,
        package: document.getElementById("f_package").value,
        pricePerDay: r.perDay,
        price: r.total,
        message: document.getElementById("f_message").value,
        bookingStatus: "neu",
        paymentStatus: "offen",
        paidAmount: 0,
        createdAt: serverTimestamp()
      });
      // öffentliche Sperrliste (ohne persönliche Daten) mit gleicher ID
      try{
        await setDoc(doc(db,"blocked",bref.id), { startDate, endDate, uid: currentUser.uid });
      }catch(err){ console.warn("Sperrliste nicht geschrieben", err); }

      status.textContent = "Danke! Deine Buchung ist da — schau bald bei 'Meine Buchungen' vorbei.";
      status.style.color = "var(--mint)";
      setTimeout(()=>location.href="meine-buchungen.html", 1400);
    }catch(err){
      status.textContent = "Ups, das hat nicht geklappt. Versuch's nochmal.";
      status.style.color = "var(--pink)";
      console.error(err);
    }
  });
</script>
</body>
</html>
