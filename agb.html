<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGB — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Rechtliches</div>
    <h2 class="section-title">Allgemeine Geschäftsbedingungen</h2>
    <div class="legal-text" id="legalText">Lädt…</div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { db } from "./firebase-init.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  renderNav("agb.html");
  renderFooter();

  async function load(){
    const snap = await getDoc(doc(db,"config","legal"));
    const text = snap.exists() && snap.data().agb
      ? snap.data().agb
      : "Hier stehen bald die AGB von Candy Bar Vogtland.\n\nDieser Platzhaltertext kann im Dashboard unter 'Rechtliche Seiten' bearbeitet werden.";
    document.getElementById("legalText").textContent = text;
  }
  load();
</script>
</body>
</html>
