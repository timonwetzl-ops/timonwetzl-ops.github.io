<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Kontakt</div>
    <h2 class="section-title">Frag uns einfach</h2>
    <form class="panel" id="contactForm">
      <label>Name</label>
      <input type="text" id="c_name" required>

      <label>E-Mail</label>
      <input type="email" id="c_email" required>

      <label>Adresse (optional)</label>
      <input type="text" id="c_address">

      <label>Betreff (optional)</label>
      <input type="text" id="c_subject">

      <div aria-hidden="true" style="position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden;"><label for="c_website">Website</label><input type="text" id="c_website" tabindex="-1" autocomplete="off"></div>

      <label>Nachricht</label>
      <textarea id="c_message" required></textarea>

      <button class="btn block" type="submit">Nachricht senden</button>
      <div id="contactStatus"></div>
    </form>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { app } from "./firebase-init.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-functions.js";
  const sendContact = httpsCallable(getFunctions(app, "europe-west3"), "createContact");

  renderNav("kontakt.html");
  renderFooter();

  document.getElementById("contactForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    const status = document.getElementById("contactStatus");
    const submitButton = e.target.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    status.textContent = "Wird gesendet…";
    status.style.color = "var(--cream-dim)";
    try{
      await sendContact({
        name: document.getElementById("c_name").value,
        email: document.getElementById("c_email").value,
        address: document.getElementById("c_address").value,
        subject: document.getElementById("c_subject").value,
        message: document.getElementById("c_message").value,
        website: document.getElementById("c_website").value
      });
      status.textContent = "Danke! Deine Nachricht ist angekommen.";
      status.style.color = "var(--mint)";
      e.target.reset();
    }catch(err){
      status.textContent = "Ups, das hat nicht geklappt. Versuch's nochmal.";
      status.style.color = "var(--pink)";
    } finally {
      submitButton.disabled = false;
    }
  });
</script>
</body>
</html>
