<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressum — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Rechtliches</div>
    <h2 class="section-title">Impressum</h2>
    <div class="legal-text" id="legalText">Lädt…</div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { db } from "./firebase-init.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  renderNav("impressum.html");
  renderFooter();

  async function load(){
    let snap;
    try{
      snap = await getDoc(doc(db,"config","legal"));
    }catch(e){
      console.error(e);
      document.getElementById("legalText").textContent = "Der Text konnte gerade nicht geladen werden. Bitte versuche es später noch einmal.";
      return;
    }
    const text = snap.exists() && snap.data().impressum
      ? snap.data().impressum
      : "Hier steht bald das Impressum von Candy Bar Vogtland.\n\nDieser Platzhaltertext kann im Dashboard unter 'Rechtliche Seiten' bearbeitet werden.";
    document.getElementById("legalText").textContent = text;
  }
  load();
</script>
</body>
</html>
