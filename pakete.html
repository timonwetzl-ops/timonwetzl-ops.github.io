<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pakete — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <h2 class="section-title">Pakete</h2>
    <div class="grid-cards" id="packagesGrid">
      <p class="center-note">Pakete werden geladen…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { renderNav, renderFooter } from "./nav.js";
renderNav(location.pathname.split("/").pop()||"index.html");renderFooter();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>(Number(n||0)/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
async function api(url){const r=await fetch(url,{headers:{Accept:"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"Laden fehlgeschlagen");return d;}

async function load(){
 const grid=document.getElementById("packagesGrid");
 try{const {packages}=await api("./backend/php/api/packages.php");
 grid.innerHTML=packages.map(p=>{const img=(p.images||[]).find(x=>x.startsWith("https://"));return `<a class="pkg-card" href="paket-detail.html?id=${encodeURIComponent(p.id)}"><div class="thumb">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy" decoding="async">`:""}</div><div class="accent"></div><h3>${esc(p.name)}</h3><div class="price">${euro(p.priceCents)} <small>für den ersten Tag</small></div><p>${esc(p.description)}</p></a>`;}).join("");
 }catch(e){grid.innerHTML='<p class="center-note">Pakete konnten gerade nicht geladen werden. Bitte versuche es später erneut.</p>';console.error(e);}
}load();
</script>
</body>
</html>
