<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Galerie</div>
    <h2 class="section-title">So sieht's live aus</h2>
    <div class="gallery" id="galleryGrid">
      <p class="center-note">Bilder werden geladen…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { renderNav, renderFooter } from "./nav.js";
renderNav("galerie.html");renderFooter();
(async()=>{
 const grid=document.getElementById("galleryGrid");
 try{
  const r=await fetch("./backend/php/api/content.php",{headers:{Accept:"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"Laden fehlgeschlagen");
  const images=d.settings?.galleryImages||[];
  if(!images.length){grid.innerHTML="<p class='center-note'>Noch keine Bilder hinterlegt.</p>";return;}
  grid.innerHTML=images.map((url,i)=>{const img=document.createElement("img");return `<img src="${String(url).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" alt="Candybar Foto ${i+1}" loading="lazy" decoding="async">`;}).join("");
 }catch(e){grid.innerHTML="<p class='center-note'>Die Galerie konnte gerade nicht geladen werden.</p>";console.error(e);}
})();
</script>
</body>
</html>
