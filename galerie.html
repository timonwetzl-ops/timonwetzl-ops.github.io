<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Galerie</div>
    <h2 class="section-title">So sieht's live aus</h2>
    <div class="gallery" id="galleryGrid">
      <p class="center-note">Bilder werden geladen…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { db } from "./firebase-init.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  renderNav("galerie.html");
  renderFooter();

  async function loadGallery(){
    const snap = await getDoc(doc(db,"config","gallery"));
    const grid = document.getElementById("galleryGrid");
    const images = snap.exists() ? (snap.data().images || []) : [];
    if(images.length === 0){
      grid.innerHTML = "<p class='center-note'>Noch keine Bilder hochgeladen.</p>";
      return;
    }
    grid.innerHTML = images.map(url => `<img src="${url}" alt="Candybar Foto" loading="lazy">`).join("");
  }
  loadGallery();
</script>
</body>
</html>
