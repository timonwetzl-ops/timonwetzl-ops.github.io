name: Backend checks

on:
  push:
    branches: [firebase-security-fix]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check backend/cloudflare/worker.js
      - name: D1 schema and booking-lock tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
