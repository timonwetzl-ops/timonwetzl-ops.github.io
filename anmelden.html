<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section style="display:flex;justify-content:center;">
    <div class="panel" style="max-width:420px;width:100%;">
      <h2 id="authTitle" class="section-title" style="margin-bottom:20px;">Anmelden</h2>
      <div class="authField">
        <label>E-Mail</label>
        <input type="email" id="auth_email">
      </div>
      <div class="authField">
        <label>Passwort</label>
        <input type="password" id="auth_password">
      </div>
      <button class="btn block" onclick="submitAuth()" id="authSubmitBtn">Anmelden</button>
      <div id="authError"></div>
      <div class="authSwitch" id="authSwitchText">
        Noch kein Konto? <a onclick="toggleAuthMode()">Jetzt registrieren</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { auth } from "./firebase-init.js";
  import {
    createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  renderNav("anmelden.html");
  renderFooter();

  let authMode = "login";

  window.toggleAuthMode = function(){
    authMode = authMode === "login" ? "register" : "login";
    document.getElementById("authTitle").textContent = authMode === "login" ? "Anmelden" : "Registrieren";
    document.getElementById("authSubmitBtn").textContent = authMode === "login" ? "Anmelden" : "Konto erstellen";
    document.getElementById("authSwitchText").innerHTML = authMode === "login"
      ? `Noch kein Konto? <a onclick="toggleAuthMode()">Jetzt registrieren</a>`
      : `Schon ein Konto? <a onclick="toggleAuthMode()">Jetzt anmelden</a>`;
  }

  function buildReturnUrl(){
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";
    const pkg = params.get("package");
    return pkg ? `${next}?package=${encodeURIComponent(pkg)}` : next;
  }

  window.submitAuth = async function(){
    const email = document.getElementById("auth_email").value;
    const password = document.getElementById("auth_password").value;
    const err = document.getElementById("authError");
    err.textContent = "";
    try{
      if(authMode === "login"){
        await signInWithEmailAndPassword(auth, email, password);
      } else {
        await createUserWithEmailAndPassword(auth, email, password);
      }
      location.href = buildReturnUrl();
    }catch(e){
      err.textContent = "Das hat nicht geklappt: " + (e.message || "unbekannter Fehler");
    }
  }

  onAuthStateChanged(auth, (user)=>{
    if(user){
      const params = new URLSearchParams(location.search);
      if(params.get("next")) location.href = buildReturnUrl();
    }
  });
</script>
</body>
</html>
