<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section style="display:flex;justify-content:center;">
    <div class="panel" style="max-width:420px;width:100%;" id="authPanel">
      <h2 id="authTitle" class="section-title" style="margin-bottom:20px;">Anmelden</h2>
      <button id="googleSignInBtn" type="button" disabled title="Wird später ergänzt" style="width:100%;min-height:48px;margin:0;background:#fff;color:#3c4043;border:1px solid #dadce0;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:Arial,sans-serif;font-size:15px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.76 7.18l7.73 6C44.42 37.98 46.98 31.92 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.91 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Google-Anmeldung folgt</span>
      </button>
      <button id="appleSignInBtn" type="button" disabled title="Wird später ergänzt" style="width:100%;min-height:48px;margin-top:10px;background:#000;color:#fff;border:1px solid #000;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:12px;font-family:Arial,sans-serif;font-size:15px;font-weight:500;cursor:pointer;">
        <svg width="19" height="22" viewBox="0 0 20 24" aria-hidden="true" fill="currentColor"><path d="M16.7 12.8c0-2.1 1.7-3.1 1.8-3.2-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.2 8.9.8 1.1 1.7 2.3 2.9 2.2 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-1.1 2.8-2.2.9-1.3 1.3-2.5 1.3-2.6-.1 0-2.7-1.1-2.7-3.6zM14.4 6.4c.6-.8 1-1.9.9-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.8 1.1.1 2.2-.5 2.9-1.2z"/></svg>
        <span>Apple-Anmeldung folgt</span>
      </button>
      <div style="display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--cream-dim);font-size:.85rem;"><span style="height:1px;background:var(--cream-dim);opacity:.35;flex:1;"></span>oder mit E-Mail<span style="height:1px;background:var(--cream-dim);opacity:.35;flex:1;"></span></div>
      <div class="authField">
        <label for="auth_email">E-Mail</label>
        <input type="email" id="auth_email" autocomplete="email">
      </div>
      <div class="authField">
        <label for="auth_password">Passwort</label>
        <input type="password" id="auth_password" autocomplete="current-password">
      </div>
      <div class="authField" id="pwHint" style="display:none;margin-top:-6px;color:var(--cream-dim);font-size:.82rem">Mindestens 6 Zeichen.</div>
      <button class="btn block" id="authSubmitBtn">Anmelden</button>
      <div id="authError" role="alert"></div>
      <div class="authSwitch" id="forgotRow"><a id="forgotLink">Passwort vergessen?</a></div>
      <div class="authSwitch" id="authSwitchText">
        Noch kein Konto? <a id="switchLink">Jetzt registrieren</a>
      </div>
    </div>

    <div class="panel" style="max-width:420px;width:100%;display:none;" id="verifyPanel">
      <h2 class="section-title" id="verifyTitle" style="margin-bottom:14px;">E-Mail bestätigen</h2>
      <p id="verifyText" style="color:var(--cream-dim);margin:0 0 14px"></p>
      <div id="verifyPasswordWrap" class="authField" style="display:none;">
        <label for="verifyPassword">Neues Passwort (mindestens 12 Zeichen)</label>
        <input type="password" id="verifyPassword" autocomplete="new-password" minlength="12">
      </div>
      <button class="btn block" id="verifyActionBtn" type="button">Bestätigen</button>
      <button class="btn block outline" id="resendBtn" type="button" style="display:none;margin-top:10px;">E-Mail erneut senden</button>
      <div id="verifyMsg" role="status" style="margin-top:12px;font-size:.9rem;min-height:1.2em"></div>
      <div class="authSwitch"><a id="verifyBack">Zur Anmeldung</a></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  renderNav("anmelden.html");
  renderFooter();

  const API = "./backend/php/api/customer.php";
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let mode = "login", csrf = "", activeToken = params.get("token") || "";
  const safeNext = () => {
    const next = params.get("next") || "index.html";
    return /^[a-z0-9-]+\.html$/i.test(next) ? next : "index.html";
  };
  const returnUrl = () => {
    const next = safeNext();
    const pkg = params.get("package");
    return pkg && next === "anfrage.html" ? next + "?package=" + encodeURIComponent(pkg) : next;
  };
  async function post(action, data = {}, useCsrf = false) {
    const headers = { "Content-Type": "application/json", "Accept": "application/json" };
    if (useCsrf && csrf) headers["X-CSRF-Token"] = csrf;
    const response = await fetch(API, { method: "POST", headers, body: JSON.stringify({ action, ...data }) });
    const result = await response.json().catch(() => ({ error: "Ungültige Serverantwort." }));
    if (!response.ok) throw new Error(result.error || "Das hat leider nicht geklappt.");
    return result;
  }
  function showMessage(message, good = false) {
    $("authError").style.color = good ? "var(--mint)" : "var(--pink)";
    $("authError").textContent = message;
  }
  function setMode(next) {
    mode = next;
    const register = mode === "register";
    $("authTitle").textContent = register ? "Registrieren" : "Anmelden";
    $("authSubmitBtn").textContent = register ? "Konto erstellen" : "Anmelden";
    $("auth_password").autocomplete = register ? "new-password" : "current-password";
    $("pwHint").textContent = "Mindestens 12 Zeichen.";
    $("pwHint").style.display = register ? "block" : "none";
    $("forgotRow").style.display = register ? "none" : "block";
    $("authSwitchText").innerHTML = register
      ? 'Schon ein Konto? <a id="switchLink">Jetzt anmelden</a>'
      : 'Noch kein Konto? <a id="switchLink">Jetzt registrieren</a>';
    $("switchLink").addEventListener("click", () => { showMessage(""); setMode(register ? "login" : "register"); });
  }
  function showActionPanel(title, message, buttonText, withPassword = false, withResend = false) {
    $("authPanel").style.display = "none";
    $("verifyPanel").style.display = "block";
    $("verifyTitle").textContent = title;
    $("verifyText").textContent = message;
    $("verifyActionBtn").textContent = buttonText;
    $("verifyPasswordWrap").style.display = withPassword ? "block" : "none";
    $("resendBtn").style.display = withResend ? "block" : "none";
    $("verifyMsg").textContent = "";
  }
  $("switchLink").addEventListener("click", () => setMode("register"));
  $("authSubmitBtn").addEventListener("click", async () => {
    const email = $("auth_email").value.trim();
    const password = $("auth_password").value;
    showMessage("");
    if (!email || !password) { showMessage("Bitte gib E-Mail und Passwort ein."); return; }
    $("authSubmitBtn").disabled = true;
    try {
      if (mode === "register") {
        const result = await post("register", { email, password });
        showActionPanel("Fast geschafft!", result.message, "Zur Anmeldung", false, true);
        $("verifyMsg").textContent = result.verificationSent ? "Prüfe auch deinen Spam-Ordner." : "Der Mailversand muss noch auf dem Server eingerichtet werden.";
      } else {
        const result = await post("login", { email, password });
        csrf = result.csrf || "";
        location.href = returnUrl();
      }
    } catch (error) {
      showMessage(error.message);
      if (error.message.includes("bestätige zuerst")) {
        showActionPanel("E-Mail noch nicht bestätigt", error.message, "Zur Anmeldung", false, true);
      }
    } finally { $("authSubmitBtn").disabled = false; }
  });
  $("auth_password").addEventListener("keydown", e => { if (e.key === "Enter") $("authSubmitBtn").click(); });
  $("auth_email").addEventListener("keydown", e => { if (e.key === "Enter") $("authSubmitBtn").click(); });
  $("forgotLink").addEventListener("click", async e => {
    e.preventDefault();
    const email = $("auth_email").value.trim();
    if (!email) { showMessage("Bitte trage zuerst deine E-Mail-Adresse ein."); return; }
    try {
      const result = await post("forgot", { email });
      showMessage(result.message, true);
    } catch (error) { showMessage(error.message); }
  });
  $("resendBtn").addEventListener("click", async () => {
    const email = $("auth_email").value.trim();
    if (!email) { $("verifyMsg").textContent = "Bitte gehe zurück und trage deine E-Mail-Adresse ein."; return; }
    $("resendBtn").disabled = true;
    try {
      const result = await post("resend_verify", { email });
      $("verifyMsg").textContent = result.message;
    } catch (error) { $("verifyMsg").textContent = error.message; }
    finally { $("resendBtn").disabled = false; }
  });
  $("verifyBack").addEventListener("click", () => {
    $("verifyPanel").style.display = "none";
    $("authPanel").style.display = "block";
    $("verifyPassword").value = "";
    showMessage("");
  });
  $("verifyActionBtn").addEventListener("click", async () => {
    const btn = $("verifyActionBtn");
    btn.disabled = true;
    try {
      if (params.get("verify") === "1") {
        const result = await post("verify_email", { token: activeToken });
        $("verifyText").textContent = result.message;
        $("verifyMsg").textContent = "Du kannst dich jetzt anmelden.";
        $("verifyMsg").style.color = "var(--mint)";
        btn.style.display = "none";
      } else if (params.get("reset") === "1") {
        const password = $("verifyPassword").value;
        const result = await post("reset_password", { token: activeToken, password });
        $("verifyText").textContent = result.message;
        $("verifyMsg").textContent = "Melde dich jetzt mit deinem neuen Passwort an.";
        $("verifyMsg").style.color = "var(--mint)";
        btn.style.display = "none";
        $("verifyPasswordWrap").style.display = "none";
      } else {
        $("verifyPanel").style.display = "none";
        $("authPanel").style.display = "block";
        setMode("login");
      }
    } catch (error) {
      $("verifyMsg").textContent = error.message;
      $("verifyMsg").style.color = "var(--pink)";
    } finally { btn.disabled = false; }
  });
  if (params.get("verify") === "1") {
    showActionPanel("E-Mail bestätigen", "Tippe auf den Knopf, um deine E-Mail-Adresse zu bestätigen.", "E-Mail bestätigen");
  } else if (params.get("reset") === "1") {
    showActionPanel("Neues Passwort festlegen", "Wähle ein neues Passwort mit mindestens 12 Zeichen.", "Passwort speichern", true);
  } else if (params.get("verified") === "1") {
    showMessage("E-Mail bestätigt! Du kannst dich jetzt anmelden.", true);
  }
  fetch(API + "?action=me", { headers: { Accept: "application/json" } })
    .then(r => r.ok ? r.json() : null)
    .then(state => {
      if (state?.authenticated && !params.has("verify") && !params.has("reset")) {
        csrf = state.csrf || "";
        location.href = returnUrl();
      }
    })
    .catch(() => {});
</script>
</body>
</html>
