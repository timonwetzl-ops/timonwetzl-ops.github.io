<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Buchungen — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="eyebrow">Dein Konto</div>
    <h2 class="section-title">Meine Buchungen</h2>
    <div id="bookingsList"><p class="center-note">Lädt…</p></div>

    <section class="panel" style="margin-top:42px;">
      <div class="eyebrow">Verwalten</div>
      <h3 style="margin:0 0 8px;">Kontoeinstellungen</h3>
      <p style="color:var(--cream-dim);font-size:.9rem;margin:0 0 16px;">
        Hier kannst du dein Candy-Bar-Kundenkonto dauerhaft löschen.
        Bestehende Buchungen werden dadurch nicht storniert und bleiben zunächst als Buchungsunterlagen erhalten.
      </p>
      <button class="btn block" id="deleteAccountBtn" type="button"
        style="background:#a83248;border-color:#a83248;color:#fff;">Konto dauerhaft löschen</button>
      <p id="deleteAccountMsg" role="status" style="font-size:.9rem;margin:10px 0 0;"></p>
    </section>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  renderNav("meine-buchungen.html");
  renderFooter();

  const API = "./backend/php/api/customer.php";
  const $ = id => document.getElementById(id);
  let csrf = "";
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
  const date = value => {
    if (!value) return "—";
    const d = new Date(String(value).slice(0,10) + "T12:00:00");
    return Number.isNaN(d.getTime()) ? "—" : d.toLocaleDateString("de-DE");
  };
  const euro = cents => (Number(cents || 0) / 100).toLocaleString("de-DE", { style:"currency", currency:"EUR" });
  const bookingLabel = status => status === "bestätigt" ? "Bestätigt" : status === "abgelehnt" ? "Abgelehnt" : "Eingegangen";
  const paymentLabel = status => status === "bezahlt" ? "Bezahlt" : status === "fehlgeschlagen" ? "Fehlgeschlagen" : status === "erstattet" ? "Erstattet" : "Offen";
  const paymentClass = status => status === "bezahlt" ? "bestätigt" : status === "fehlgeschlagen" ? "abgelehnt" : "neu";

  async function getJson(url, headers = {}) {
    const response = await fetch(url, { headers: { Accept:"application/json", ...headers } });
    const result = await response.json().catch(() => ({ error:"Ungültige Serverantwort." }));
    if (!response.ok) throw new Error(result.error || "Daten konnten nicht geladen werden.");
    return result;
  }
  async function post(action, data = {}) {
    const response = await fetch(API, {
      method:"POST",
      headers: { "Content-Type":"application/json", "Accept":"application/json", "X-CSRF-Token":csrf },
      body: JSON.stringify({ action, ...data })
    });
    const result = await response.json().catch(() => ({ error:"Ungültige Serverantwort." }));
    if (!response.ok) throw new Error(result.error || "Aktion fehlgeschlagen.");
    return result;
  }

  async function load() {
    const list = $("bookingsList");
    try {
      const me = await getJson(API + "?action=me");
      if (!me.authenticated) {
        location.href = "anmelden.html?next=meine-buchungen.html";
        return;
      }
      csrf = me.csrf || "";
      const result = await getJson(API + "?action=bookings", { "X-CSRF-Token":csrf });
      const rows = result.bookings || [];
      if (!rows.length) {
        list.innerHTML = "<p class='center-note'>Du hast noch keine Buchungen. <a href='pakete.html' style='color:var(--mint)'>Jetzt ein Paket ansehen</a></p>";
        return;
      }
      list.innerHTML = rows.map(b => {
        const paid = Number(b.paid_amount_cents || 0);
        const price = Number(b.price_cents || 0);
        const open = Math.max(price - paid, 0);
        const range = date(b.event_start) === date(b.event_end) ? date(b.event_start) : date(b.event_start) + " – " + date(b.event_end);
        return `
          <div class="booking-row" style="flex-direction:column;align-items:flex-start;">
            <div style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:10px;">
              <div>
                <strong>${esc(b.package_name)}</strong> — ${esc(range)}<br>
                <span style="color:var(--cream-dim);font-size:.82rem">Abholung: ${esc(date(b.pickup_date))} · Rückgabe: ${esc(date(b.return_date))}</span><br>
                <span style="color:var(--cream-dim);font-size:.85rem">${b.location ? "Ort: " + esc(b.location) : ""} ${b.message ? " · " + esc(b.message) : ""}</span>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <div class="status-badge ${esc(b.booking_status)}">Buchung: ${esc(bookingLabel(b.booking_status))}</div>
                <div class="status-badge ${paymentClass(b.payment_status)}">Zahlung: ${esc(paymentLabel(b.payment_status))}</div>
              </div>
            </div>
            <div style="font-size:.85rem;color:var(--cream-dim);margin-top:10px">
              Preis: ${euro(price)} · Bezahlt: ${euro(paid)} · Offen: ${euro(open)}
            </div>
          </div>`;
      }).join("");
    } catch (error) {
      list.innerHTML = "<p class='center-note'>" + esc(error.message) + "</p>";
    }
  }

  $("deleteAccountBtn").addEventListener("click", async () => {
    const msg = $("deleteAccountMsg");
    const first = confirm("Möchtest du dein Kundenkonto wirklich dauerhaft löschen? Deine bisherigen Buchungsunterlagen werden dadurch nicht automatisch gelöscht.");
    if (!first) return;
    const password = prompt("Bitte gib zur Bestätigung dein Kontopasswort ein:");
    if (password === null || password === "") { msg.textContent = "Löschen abgebrochen."; return; }
    const btn = $("deleteAccountBtn");
    btn.disabled = true;
    msg.textContent = "Konto wird gelöscht …";
    try {
      await post("delete", { password });
      location.href = "index.html";
    } catch (error) {
      msg.textContent = error.message;
      btn.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
