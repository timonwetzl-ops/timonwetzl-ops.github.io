<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paket — Candy Bar Vogtland</title>
<script>try{var t=localStorage.getItem("theme");if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  .detail-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start;}
  @media (max-width:840px){.detail-grid{grid-template-columns:1fr;}}

  .detail-img-wrap{position:sticky;top:90px;}
  .detail-img{border-radius:8px;overflow:hidden;aspect-ratio:4/5;background:var(--bg-card);}
  .detail-img img{width:100%;height:100%;object-fit:cover;display:block;}
  @media (max-width:840px){
    .detail-img-wrap{position:static;}
    .detail-img{aspect-ratio:4/3;}
  }

  .detail-price{font-variant-numeric:tabular-nums;color:var(--cream-dim);font-size:1.3rem;margin:10px 0 18px;}
  .detail-note{color:var(--cream-dim);font-size:.9rem;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}

  .includes{margin:22px 0;padding:0;list-style:none;}
  .includes li{padding:9px 0;font-size:.94rem;display:flex;gap:10px;align-items:flex-start;}
  .includes li .check{color:var(--mint);font-weight:700;flex-shrink:0;}

  .extras{margin-top:6px;padding-left:22px;color:var(--cream-dim);font-size:.85rem;}
  .extras li{padding:3px 0;}
  .extras-title{font-size:.85rem;font-weight:600;margin-top:18px;margin-bottom:6px;}
</style>
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="detail-grid" id="detailContent">
      <p class="center-note">Lädt…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
import { renderNav, renderFooter } from "./nav.js";
renderNav(location.pathname.split("/").pop()||"index.html");renderFooter();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const euro=n=>(Number(n||0)/100).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
async function api(url){const r=await fetch(url,{headers:{Accept:"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.error||"Laden fehlgeschlagen");return d;}

const id=new URLSearchParams(location.search).get("id");
async function load(){
 const content=document.getElementById("detailContent");
 try{
  if(!["basic","comfort","rundumsorglos"].includes(id))throw Error("Paket nicht gefunden.");
  const {packages}=await api("./backend/php/api/packages.php"),p=packages.find(x=>x.id===id);if(!p)throw Error("Paket nicht gefunden.");
  const img=(p.images||[]).find(x=>x.startsWith("https://"));
  content.innerHTML=`${img?`<div class="detail-img-wrap"><div class="detail-img"><img src="${esc(img)}" alt="${esc(p.name)}"></div></div>`:'<div class="detail-img-wrap"><div class="detail-img"></div></div>'}<div><div class="eyebrow">Paket</div><h1 class="section-title" style="margin-bottom:0">${esc(p.name)}</h1><div class="detail-price">${euro(p.priceCents)} <small style="font-size:.65em">für den 1. Veranstaltungstag</small></div><p style="color:var(--cream-dim);font-size:.85rem;margin:-8px 0 14px">Jeder weitere Veranstaltungstag: +89 €</p><p style="color:var(--cream-dim)">${esc(p.description)}</p>${p.includes.length?`<ul class="includes">${p.includes.map(x=>`<li><span class="check">✓</span><span>${esc(x)}</span></li>`).join("")}</ul>`:""}${p.extras.length?`<div class="extras-title">${esc(p.extrasTitle||"Details")}</div><ul class="extras">${p.extras.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${p.note?`<div class="detail-note">${esc(p.note)}</div>`:""}<a class="btn" href="anfrage.html?package=${encodeURIComponent(p.id)}">Jetzt buchen</a></div>`;
 }catch(e){content.innerHTML='<p class="center-note">Dieses Paket konnte nicht geladen werden. <a href="pakete.html">Zurück zu den Paketen</a></p>';console.error(e);}
}load();
</script>
</body>
</html>
