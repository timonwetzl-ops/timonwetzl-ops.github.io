<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paket — Candy Bar Vogtland</title>
<link rel="stylesheet" href="style.css">
<style>
  .detail-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start;}
  @media (max-width:840px){.detail-grid{grid-template-columns:1fr;}}

  .detail-img-wrap{position:sticky;top:90px;}
  .detail-img{border-radius:8px;overflow:hidden;aspect-ratio:4/5;background:var(--bg-card);}
  .detail-img img{width:100%;height:100%;object-fit:cover;display:block;}
  @media (max-width:840px){
    .detail-img-wrap{position:static;}
    .detail-img{aspect-ratio:4/3;}
  }

  .detail-price{font-family:'JetBrains Mono',monospace;color:var(--cream-dim);font-size:1.3rem;margin:10px 0 18px;}
  .detail-note{color:var(--cream-dim);font-size:.9rem;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}

  .includes{margin:22px 0;padding:0;list-style:none;}
  .includes li{padding:9px 0;font-size:.94rem;display:flex;gap:10px;align-items:flex-start;}
  .includes li .check{color:var(--mint);font-weight:700;flex-shrink:0;}

  .extras{margin-top:6px;padding-left:22px;color:var(--cream-dim);font-size:.85rem;}
  .extras li{padding:3px 0;}
  .extras-title{font-size:.85rem;font-weight:600;margin-top:18px;margin-bottom:6px;}
</style>
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<main>
  <section>
    <div class="detail-grid" id="detailContent">
      <p class="center-note">Lädt…</p>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script type="module">
  import { renderNav, renderFooter } from "./nav.js";
  import { db, placeholderImg } from "./firebase-init.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  renderNav("pakete.html");
  renderFooter();

  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const VALID_IDS = ["basic","comfort","rundumsorglos"];

  async function load(){
    const content = document.getElementById("detailContent");
    if(!id || !VALID_IDS.includes(id)){
      content.innerHTML = `<p class="center-note">Dieses Paket wurde nicht gefunden. <a href="pakete.html" style="color:var(--mint)">Zurück zu den Paketen</a></p>`;
      return;
    }
    const snap = await getDoc(doc(db,"packages",id));
    if(!snap.exists()){
      content.innerHTML = `<p class="center-note">Dieses Paket wurde nicht gefunden. <a href="pakete.html" style="color:var(--mint)">Zurück zu den Paketen</a></p>`;
      return;
    }
    const p = snap.data();
    const images = (p.images && p.images.length) ? p.images : [placeholderImg(p.name||id,"#e8789e")];
    const includes = (p.includes || []).filter(Boolean);
    const extras = (p.extras || []).filter(Boolean);

    content.innerHTML = `
      <div class="detail-img-wrap">
        <div class="detail-img"><img src="${images[0]}"></div>
      </div>
      <div>
        <div class="eyebrow">Paket</div>
        <h1 class="section-title" style="margin-bottom:0">${p.name||""}</h1>
        <div class="detail-price">${p.price||""}</div>
        <p style="color:var(--cream-dim)">${p.description||""}</p>
        ${includes.length ? `<ul class="includes">${includes.map(i=>`<li><span class="check">✓</span><span>${i}</span></li>`).join("")}</ul>` : ""}
        ${extras.length ? `<div class="extras-title">${p.extrasTitle || "Details"}</div><ul class="extras">${extras.map(i=>`<li>${i}</li>`).join("")}</ul>` : ""}
        ${p.note ? `<div class="detail-note">${p.note}</div>` : ""}
        <a class="btn" href="anfrage.html?package=${encodeURIComponent(p.name||id)}">Jetzt buchen</a>
      </div>`;
  }
  load();
</script>
</body>
</html>
