<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard – Candy Bar Vogtland</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1023;--card:#26152f;--card2:#2f1a3a;--pink:#ff3d68;--yellow:#ffd23f;--mint:#4ecdc4;--cream:#f5efe6;--dim:#c9bfd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:"Work Sans"}h1,h2,h3{font-family:"Baloo 2"}#gate{min-height:100vh;display:grid;place-items:center;text-align:center}#app{display:none;max-width:1100px;margin:auto;padding:40px 5vw}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.stats,.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}.stat,.card{background:var(--card);border:1px solid #ffffff14;border-radius:16px;padding:20px;margin:14px 0}.stat b{font-size:1.8rem;color:var(--yellow)}input,textarea,select{background:var(--card2);color:var(--cream);border:1px solid #ffffff22;border-radius:8px;padding:10px;width:100%;margin:5px 0}textarea{min-height:150px}.btn{padding:10px 17px;border:0;border-radius:999px;background:var(--mint);color:#1b1023;font-weight:700;cursor:pointer;margin:5px}.danger{background:var(--pink)}table{width:100%;border-collapse:collapse;background:var(--card)}td,th{padding:10px;border-bottom:1px solid #ffffff12;text-align:left;font-size:.88rem}.imgs{display:flex;flex-wrap:wrap;gap:10px}.imgs div{position:relative}.imgs img{width:120px;height:100px;object-fit:cover;border-radius:10px}.imgs button{position:absolute;right:3px;top:3px;border:0;border-radius:50%;background:var(--pink);cursor:pointer}.msg{color:var(--mint);min-height:20px}
</style>
</head>
<body>
<div id="gate"><div><h1>Candy Bar Vogtland</h1><p class="msg">Admin-Zugang</p><input id="code" type="password" placeholder="Zugangscode"><br><button class="btn" onclick="login()">Anmelden</button><p id="err" style="color:var(--pink)"></p></div></div>
<div id="app">
<div class="top"><h1>Dashboard – Candy Bar Vogtland</h1><button class="btn danger" onclick="location.reload()">Abmelden</button></div>
<div class="stats"><div class="stat">Anfragen gesamt<br><b id="total">–</b></div><div class="stat">Bestätigt<br><b id="confirmed">–</b></div><div class="stat">Umsatz<br><b id="revenue">–</b></div></div>

<section><h2>Buchungen & Anfragen</h2><div style="overflow:auto"><table><thead><tr><th>Datum</th><th>Name</th><th>Paket</th><th>Kontakt</th><th>Ort</th><th>Status</th></tr></thead><tbody id="bookings"></tbody></table></div></section>

<section><h2>Startseitenbild</h2><div class="card"><input id="heroFile" type="file" accept="image/*"><button class="btn" onclick="uploadHero()">Bild hochladen</button><span id="heroMsg" class="msg"></span></div></section>

<section><h2>Pakete</h2><div id="packages"></div></section>

<section><h2>Galerie</h2><div class="card"><input id="galleryFile" type="file" accept="image/*"><button class="btn" onclick="uploadGallery()">Bild hochladen</button><span id="galleryMsg" class="msg"></span></div><div class="imgs" id="gallery"></div></section>

<section><h2>Rechtliche Seiten</h2><div class="card"><label>Impressum</label><textarea id="impressum"></textarea><label>AGB</label><textarea id="agb"></textarea><label>Datenschutz</label><textarea id="datenschutz"></textarea><button class="btn" onclick="saveLegal()">Speichern</button><span id="legalMsg" class="msg"></span></div></section>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,doc,getDoc,updateDoc,setDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import{getStorage,ref,uploadBytes,getDownloadURL}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import{firebaseConfig,DASHBOARD_CODE}from"./firebase-config.js";
const app=initializeApp(firebaseConfig),db=getFirestore(app),storage=getStorage(app);
window.login=()=>{if(document.getElementById("code").value===DASHBOARD_CODE){gate.style.display="none";appEl.style.display="block";loadAll()}else err.textContent="Falscher Zugangscode."};
const gate=document.getElementById("gate"),appEl=document.getElementById("app");
async function upload(file,path){const r=ref(storage,`${path}/${Date.now()}_${file.name}`);await uploadBytes(r,file);return getDownloadURL(r)}
async function loadAll(){await loadBookings();await loadPackages();await loadGallery();await loadLegal()}
async function loadBookings(){const s=await getDocs(collection(db,"bookings")),body=document.getElementById("bookings");body.innerHTML="";let t=0,c=0,r=0;s.forEach(d=>{const b=d.data();t++;if(b.status==="bestätigt")c++;body.innerHTML+=`<tr><td>${b.eventDate||""}</td><td>${b.name||""}</td><td>${b.package||""}</td><td>${b.email||""}<br>${b.phone||""}</td><td>${b.location||""}</td><td><select onchange="status('${d.id}',this.value)"><option ${b.status==="neu"?"selected":""}>neu</option><option ${b.status==="bestätigt"?"selected":""}>bestätigt</option><option ${b.status==="abgelehnt"?"selected":""}>abgelehnt</option></select></td></tr>`});total.textContent=t;confirmed.textContent=c;revenue.textContent=r.toFixed(2)+" €"}
window.status=async(id,v)=>{await updateDoc(doc(db,"bookings",id),{status:v});loadBookings()}
async function loadPackages(){const s=await getDocs(collection(db,"packages")),wrap=document.getElementById("packages");wrap.innerHTML="";s.forEach(d=>{const p=d.data();wrap.innerHTML+=`<div class="card"><input id="n-${d.id}" value="${p.name||""}"><input id="p-${d.id}" value="${p.price||""}"><textarea id="d-${d.id}">${p.description||""}</textarea><button class="btn" onclick="savePkg('${d.id}')">Speichern</button><input type="file" accept="image/*" onchange="pkgImg(event,'${d.id}')"><div class="imgs">${(p.images||[]).map((u,i)=>`<div><img src="${u}"><button onclick="delImg('${d.id}',${i})">×</button></div>`).join("")}</div></div>`})}
window.savePkg=async id=>{await updateDoc(doc(db,"packages",id),{name:document.getElementById("n-"+id).value,price:document.getElementById("p-"+id).value,description:document.getElementById("d-"+id).value});loadPackages()}
window.pkgImg=async(e,id)=>{const f=e.target.files[0];if(!f)return;const u=await upload(f,"packages/"+id),r=doc(db,"packages",id),s=await getDoc(r),a=s.data().images||[];a.push(u);await updateDoc(r,{images:a});loadPackages()}
window.delImg=async(id,i)=>{const r=doc(db,"packages",id),s=await getDoc(r),a=s.data().images||[];a.splice(i,1);await updateDoc(r,{images:a});loadPackages()}
async function loadGallery(){const s=await getDoc(doc(db,"config","gallery")),a=s.exists()?s.data().images||[]:[],g=document.getElementById("gallery");g.innerHTML=a.map((u,i)=>`<div><img src="${u}"><button onclick="delGallery(${i})">×</button></div>`).join("")}
window.uploadGallery=async()=>{const f=galleryFile.files[0];if(!f)return;const u=await upload(f,"gallery"),r=doc(db,"config","gallery"),s=await getDoc(r),a=s.exists()?s.data().images||[]:[];a.push(u);await setDoc(r,{images:a});galleryMsg.textContent="Hochgeladen ✓";loadGallery()}
window.delGallery=async i=>{const r=doc(db,"config","gallery"),s=await getDoc(r),a=s.data().images||[];a.splice(i,1);await setDoc(r,{images:a});loadGallery()}
window.uploadHero=async()=>{const f=heroFile.files[0];if(!f)return;const u=await upload(f,"site"),s=await getDoc(doc(db,"config","site"));await setDoc(doc(db,"config","site"),{...(s.exists()?s.data():{}),heroImage:u});heroMsg.textContent="Gespeichert ✓"}
async function loadLegal(){const s=await getDoc(doc(db,"config","legal")),a=s.exists()?s.data():{};impressum.value=a.impressum||"";agb.value=a.agb||"";datenschutz.value=a.datenschutz||""}
window.saveLegal=async()=>{await setDoc(doc(db,"config","legal"),{impressum:impressum.value,agb:agb.value,datenschutz:datenschutz.value});legalMsg.textContent="Gespeichert ✓"}
</script>
</body>
</html>
